<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Рейтинг клана | Clan Soc Reit</title>
  <style>
    :root {
      --bg-color: #121212;
      --panel-bg: #1e1e2e;
      --accent: #e94560;
      --text: #f1e9d2;
      --border: #333;
      --rank-gold: #ffd700;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background-color: var(--panel-bg);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
    }

    h1 {
      text-align: center;
      color: var(--rank-gold);
      text-shadow: 2px 2px 0px #000;
      margin-bottom: 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: #888;
      text-transform: uppercase;
      font-size: 0.85rem;
      background: rgba(255,255,255,0.05);
    }

    td:first-child {
      font-weight: bold;
      color: #4cc9f0;
      font-size: 1.1rem;
    }

    .rank-1 { color: #ffd700; font-weight: bold; }
    .rank-2 { color: #c0c0c0; font-weight: bold; }
    .rank-3 { color: #cd7f32; font-weight: bold; }

    .error-msg {
      color: #ff5555;
      text-align: center;
      padding: 1rem;
      background: rgba(233, 69, 96, 0.1);
      border-radius: 8px;
      margin-top: 1rem;
      font-weight: bold;
    }

    .note {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      color: #555;
      border-top: 1px solid #333;
      padding-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏆 Рейтинг социальных баллов</h1>

    <table>
      <thead>
        <tr>
          <th style="width: 50px;">#</th>
          <th>Игрок (Ник)</th>
          <th style="text-align: right;">Баллы</th>
        </tr>
      </thead>
      <tbody id="playersTableBody">
        <tr>
          <td colspan="3" style="text-align: center;">Загрузка данных...</td>
        </tr>
      </tbody>
    </table>
    
    <div id="errorBox" class="error-msg" style="display: none;"></div>
    <p class="note">Данные берутся из Google Таблицы. Обновление может занять до 5 минут.</p>
  </div>

  <script>
    // 1. ВСТАВЬ СЮДА СВОЙ ID ТАБЛИЦЫ (только буквы и цифры между /d/ и /edit)
    const spreadsheetId = '1UeAfbF_jFYWSj1GXLRu7apR7uUZHK12jY-FBSJOH1IM';
    
    // 2. Название листа (вкладки) внизу таблицы. Должно совпадать буква в букву!
    const sheetName = 'Лист1'; 

    async function loadData() {
      const tbody = document.getElementById('playersTableBody');
      const errorBox = document.getElementById('errorBox');
      
      try {
        // Используем старый, но самый надежный метод для публичных таблиц
        const url = `https://spreadsheets.google.com/feeds/list/${spreadsheetId}/${sheetName}/public/values?alt=json`;
        
        const response = await fetch(url);
        
        if (!response.ok) {
          throw new Error(`Ошибка доступа: \${response.status}. Проверь, что таблица открыта на "Читатель".`);
        }

        const data = await response.json();
        const entries = data.feed.entry;

        if (!entries || entries.length === 0) {
          throw new Error('В таблице нет данных или неверно указано имя листа.');
        }

        // Очищаем таблицу
        tbody.innerHTML = '';

        // Сортируем по баллам (от большего к меньшему)
        // ВАЖНО: Ключи формируются из заголовков столбцов в нижнем регистре.
        // Если в таблице заголовок "Баллы", ключ будет 'gsx\$баллы'
        const sortedEntries = entries.sort((a, b) => {
          const scoreA = parseInt(a['gsx$баллы']?.$t || 0);
          const scoreB = parseInt(b['gsx$баллы']?.$t || 0);
          return scoreB - scoreA;
        });

        sortedEntries.forEach((entry, index) => {
          const rank = index + 1;
          // Ищем ник. Если в таблице колонка "Игрок", ключ 'gsx$игрок'. Если "Ник" - 'gsx$ник'
          const name = entry['gsx$игрок']?.$t || entry['gsx$ник']?.$t || 'Неизвестный';
          const score = entry['gsx$баллы']?.$t || 0;
          
          let rankClass = '';
          if (rank === 1) rankClass = 'rank-1';
          if (rank === 2) rankClass = 'rank-2';
          if (rank === 3) rankClass = 'rank-3';

          const row = `
            <tr>
              <td class="${rankClass}">${rank}</td>
              <td class="${rankClass}">${name}</td>
              <td style="text-align: right;">\${score}</td>
            </tr>
          `;
          tbody.innerHTML += row;
        });

      } catch (error) {
        console.error(error);
        errorBox.style.display = 'block';
        errorBox.textContent = 'Ошибка: ' + error.message;
        tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #ff5555;">Не удалось загрузить данные. Смотри консоль (F12).</td></tr>';
      }
    }

    loadData();
  </script>
</body>
</html>
