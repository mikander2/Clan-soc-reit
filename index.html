<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Рейтинг клана | Clan Soc Reit</title>
  <style>
    :root {
      --bg-color: #121212;
      --panel-bg: #1e1e2e;
      --accent: #e94560;
      --text: #f1e9d2;
      --border: #333;
      --rank-gold: #ffd700;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background-color: var(--panel-bg);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
    }

    h1 {
      text-align: center;
      color: var(--rank-gold);
      text-shadow: 2px 2px 0px #000;
      margin-bottom: 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: #888;
      text-transform: uppercase;
      font-size: 0.85rem;
      background: rgba(255,255,255,0.05);
    }

    td:first-child {
      font-weight: bold;
      color: #4cc9f0;
      font-size: 1.1rem;
    }

    .rank-1 { color: #ffd700; font-weight: bold; }
    .rank-2 { color: #c0c0c0; font-weight: bold; }
    .rank-3 { color: #cd7f32; font-weight: bold; }

    .error-msg {
      color: #ff5555;
      text-align: center;
      padding: 1rem;
      background: rgba(233, 69, 96, 0.1);
      border-radius: 8px;
      margin-top: 1rem;
      font-weight: bold;
    }

    .note {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      color: #555;
      border-top: 1px solid #333;
      padding-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏆 Рейтинг социальных баллов</h1>

    <table>
      <thead>
        <tr>
          <th style="width: 50px;">#</th>
          <th>Игрок (Ник)</th>
          <th style="text-align: right;">Баллы</th>
        </tr>
      </thead>
      <tbody id="playersTableBody">
        <tr>
          <td colspan="3" style="text-align: center;">Загрузка данных...</td>
        </tr>
      </tbody>
    </table>
    
    <div id="errorBox" class="error-msg" style="display: none;"></div>
    <p class="note">Данные берутся из Google Таблицы.</p>
  </div>

  <script>
    // 1. ВСТАВЬ СЮДА СВОЙ ID ТАБЛИЦЫ
    const spreadsheetId = '1UeAfbF_jFYWSj1GXLRu7apR7uUZHK12jY-FBSJOH1IM';
    
    // 2. Диапазон данных. 
    // A:B означает "брать данные из столбцов A и B". 
    // Нам не нужно указывать имя листа! Скрипт сам возьмет первый доступный лист.
    const range = 'A:B'; 

    async function loadData() {
      const tbody = document.getElementById('playersTableBody');
      const errorBox = document.getElementById('errorBox');
      
      try {
        // НОВЫЙ МЕТОД: Используем sheets.googleapis.com вместо старого feeds/list
        // Он стабильнее и не требует точного совпадения имени листа
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${range}?key=AIzaSyA6O_zX-1234567890`; 
        // ВНИМАНИЕ: Ниже я объясню про ключ API!
        
        // Так как у нас нет своего API ключа (и его сложно настроить новичку), 
        // мы используем хитрость: если таблица публичная, мы можем попробовать получить данные 
        // через специальный формат, но Google Sheets API без ключа для публичных таблиц 
        // часто требует именно ключ. 
        
        // ПОЭТОМУ: Самый простой рабочий вариант для тебя сейчас — 
        // использовать тот же старый метод, но с ПРАВИЛЬНОЙ обработкой ошибки 404,
        // ИЛИ (лучше) использовать метод, который я дам ниже, который работает БЕЗ ключа,
        // если таблица открыта на "Читатель".
        
        // ПЕРЕПИСЫВАЕМ НА РАБОЧИЙ ВАРИАНТ БЕЗ КЛЮЧА (через CSV экспорт)
        const csvUrl = `https://docs.google.com/spreadsheets/d/\${spreadsheetId}/gviz/tq?tqx=out:csv&sheet=Лист1`;
        
        const response = await fetch(csvUrl);
        
        if (!response.ok) {
          throw new Error('Не удалось получить данные. Проверь настройки доступа к таблице (должно быть "Читатель" для всех).');
        }

        const csvText = await response.text();
        const lines = csvText.trim().split('\n');
        
        if (lines.length <= 1) {
          throw new Error('В таблице нет данных. Добавь строки с игроками.');
        }

        // Парсим CSV вручную
        // Первая строка - заголовки, остальные - данные
        const headers = lines.split(',').map(h => h.replace(/"/g, ''));
        const dataRows = lines.slice(1).map(line => line.split(',').map(h => h.replace(/"/g, '')));

        // Находим индексы колонок по заголовкам
        const nameIndex = headers.indexOf('Игрок') !== -1 ? headers.indexOf('Игрок') : 
                          headers.indexOf('Ник') !== -1 ? headers.indexOf('Ник') : 0;
                          
        const scoreIndex = headers.indexOf('Баллы') !== -1 ? headers.indexOf('Баллы') : 
                           headers.indexOf('Points') !== -1 ? headers.indexOf('Points') : 1;

        // Превращаем в массив объектов и сортируем
        const players = dataRows.map(row => ({
          name: row[nameIndex] || 'Неизвестный',
          score: parseInt(row[scoreIndex]) || 0
        })).filter(p => p.name !== ''); // Убираем пустые строки

        const sortedPlayers = players.sort((a, b) => b.score - a.score);

        tbody.innerHTML = '';

        sortedPlayers.forEach((player, index) => {
          const rank = index + 1;
          let rankClass = '';
          if (rank === 1) rankClass = 'rank-1';
          if (rank === 2) rankClass = 'rank-2';
          if (rank === 3) rankClass = 'rank-3';

          const row = `
            <tr>
              <td class="${rankClass}">${rank}</td>
              <td class="${rankClass}">${player.name}</td>
              <td style="text-align: right;">\${player.score}</td>
            </tr>
          `;
          tbody.innerHTML += row;
        });

      } catch (error) {
        console.error(error);
        errorBox.style.display = 'block';
        errorBox.textContent = 'Ошибка: ' + error.message;
        tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #ff5555;">' + error.message + '</td></tr>';
      }
    }

    loadData();
  </script>
</body>
</html>
